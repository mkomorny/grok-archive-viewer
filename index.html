<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grok Data Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Initial Export Selection Screen -->
    <div id="export-selector" class="export-selector">
      <div class="export-modal">
        <h1>Select Data Export</h1>
        <p>Choose an export file from your <code>exports/</code> folder to view.</p>
        <div id="export-list" class="export-list">
          <!-- Populated dynamically -->
        </div>
        <p class="export-help">To add more, place JSON files in the <code>exports/</code> folder next to this app.</p>
      </div>
    </div>

    <!-- Main App UI -->
    <div id="app" style="display: none;">
      <aside id="sidebar">
        <div class="sidebar-header">
          <button id="new-chat-btn" class="new-chat-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            <span>New Chat</span>
          </button>
        </div>
        <div class="sidebar-scroll">
          <!-- We'll skip complex grouping for simplicity, just list them -->
          <div id="conversation-list" class="conversation-list"></div>
        </div>
      </aside>
      
      <main id="main-content">
        <header id="chat-header">
          <h2 id="current-chat-title"></h2>
        </header>
        
        <div id="chat-container">
          <!-- Chat messages will be injected here -->
          <div class="welcome-screen">
            <svg class="grok-splash-logo" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            <p>Select a conversation from the sidebar to view it.</p>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
